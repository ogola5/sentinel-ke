# =============================================================================
# Sentinel-KE — Kubernetes Backend Deployment + HPA (template)
#
# USAGE
#   kubectl apply -f infra/k8s/backend.yaml
#   kubectl scale deployment sentinel-backend --replicas=4
#
# PREREQUISITES
#   kubectl create secret generic sentinel-secrets \
#     --from-literal=DATABASE_URL=postgresql://... \
#     --from-literal=SECRET_KEY=... \
#     --from-literal=NEO4J_URI=bolt://... \
#     --from-literal=NEO4J_AUTH=neo4j/...
# =============================================================================

apiVersion: apps/v1
kind: Deployment
metadata:
  name: sentinel-backend
  labels:
    app: sentinel-backend
    component: api
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  selector:
    matchLabels:
      app: sentinel-backend
  template:
    metadata:
      labels:
        app: sentinel-backend
        component: api
    spec:
      terminationGracePeriodSeconds: 30
      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels:
            app: sentinel-backend
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchLabels:
                  app: sentinel-backend
              topologyKey: kubernetes.io/hostname
      containers:
      - name: sentinel-backend
        image: sentinel-ke/backend:latest
        ports:
        - containerPort: 8000
          name: http
        env:
        - name: WEB_CONCURRENCY
          value: "4"
        - name: PYTHONPATH
          value: /app
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: sentinel-secrets
              key: DATABASE_URL
        - name: SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: sentinel-secrets
              key: SECRET_KEY
        - name: NEO4J_URI
          valueFrom:
            secretKeyRef:
              name: sentinel-secrets
              key: NEO4J_URI
        - name: NEO4J_AUTH
          valueFrom:
            secretKeyRef:
              name: sentinel-secrets
              key: NEO4J_AUTH
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 15
          periodSeconds: 10
          failureThreshold: 3
        startupProbe:
          httpGet:
            path: /ready
            port: 8000
          failureThreshold: 30
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 20
          failureThreshold: 5
        resources:
          requests:
            cpu: "250m"
            memory: "512Mi"
          limits:
            cpu: "1000m"
            memory: "2Gi"

---

apiVersion: v1
kind: Service
metadata:
  name: sentinel-backend
  labels:
    app: sentinel-backend
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/path: /metrics
    prometheus.io/port: "8000"
spec:
  selector:
    app: sentinel-backend
  ports:
  - port: 8000
    targetPort: 8000
    name: http
  type: ClusterIP

---

apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: sentinel-backend-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: sentinel-backend
  minReplicas: 2
  maxReplicas: 12
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 60
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 75

---

apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: sentinel-backend-pdb
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: sentinel-backend
