# =============================================================================
# Sentinel-KE — Production Docker Compose
#
# QUICK START
#   cp .env.example .env   # fill in secrets
#   docker compose build
#   docker compose up -d
#
# AFTER CODE CHANGES
#   docker compose build <service> && docker compose up -d <service>
#
# SCALING
#   WEB_CONCURRENCY=8 docker compose up -d          # more workers, single host
#   docker stack deploy -c docker-compose.yml sentinel  # Docker Swarm
#   kubectl apply -f infra/k8s/backend.yaml             # Kubernetes
# =============================================================================

x-backend-build: &backend-build
  context: ./backend

x-backend-env: &backend-env
  env_file: .env
  environment:
    PYTHONPATH: /app

x-backend-volumes: &backend-volumes
  - gnn_artifacts:/app/artifacts    # GNN model persistence across restarts

services:

  # ── API server ──────────────────────────────────────────────────────────────
  backend:
    build: *backend-build
    <<: *backend-env
    environment:
      PYTHONPATH: /app
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-2}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      opensearch:
        condition: service_healthy
      redpanda:
        condition: service_started
      neo4j:
        condition: service_started
    volumes: *backend-volumes
    command: >
      uvicorn app.main:app
        --host 0.0.0.0
        --port 8000
        --workers ${WEB_CONCURRENCY:-2}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  # ── JupyterLab (ML training / notebooks) ───────────────────────────────────
  notebook:
    build: *backend-build
    <<: *backend-env
    environment:
      PYTHONPATH: /app
      JUPYTER_TOKEN: ${JUPYTER_TOKEN:-change-me-jupyter-token}
    ports:
      - "8888:8888"
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_started
    volumes:
      - ./notebooks:/notebooks
      - gnn_artifacts:/app/artifacts
    command: >
      jupyter lab
        --ip=0.0.0.0
        --port=8888
        --no-browser
        --allow-root
        --ServerApp.root_dir=/notebooks
        --IdentityProvider.token=${JUPYTER_TOKEN:-change-me-jupyter-token}
    restart: unless-stopped

  # ── Frontend (React + Vite) ─────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
    environment:
      VITE_API_PROXY_TARGET: http://backend:8000
    ports:
      - "3000:5173"
    command: sh ./scripts/dev-start.sh
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  # ── Redpanda ingest consumer ────────────────────────────────────────────────
  redpanda-consumer:
    build: *backend-build
    <<: *backend-env
    command: python -m app.streaming.ingest_consumer --topics sentinel.ingest
    depends_on:
      - redpanda
      - postgres
    volumes: *backend-volumes
    restart: unless-stopped

  # ── Live OSINT feeder: Feodo Tracker ──────────────────────────────────────
  feodo-ingest-worker:
    build: *backend-build
    <<: *backend-env
    command: >
      /bin/sh -c "while true; do
        python -m app.integrations.real_data_pipeline
          --source-api-key ${FEODO_SOURCE_API_KEY:-feodo-live-secret-key}
          --classification PUBLIC
          --confidence 0.96
          feodo
          --feodo-url ${FEODO_FEED_URL:-https://feodotracker.abuse.ch/downloads/ipblocklist_recommended.json}
          --timeout-sec ${FEODO_TIMEOUT_SEC:-30} || true;
        sleep ${FEODO_POLL_SEC:-300};
      done"
    depends_on:
      postgres:
        condition: service_healthy
    volumes: *backend-volumes
    restart: unless-stopped

  # ── Live OSINT feeder: URLhaus ────────────────────────────────────────────
  urlhaus-ingest-worker:
    build: *backend-build
    <<: *backend-env
    command: >
      /bin/sh -c "while true; do
        python -m app.integrations.real_data_pipeline
          --source-api-key ${URLHAUS_SOURCE_API_KEY:-urlhaus-live-secret-key}
          --classification PUBLIC
          --confidence 0.94
          urlhaus
          --urlhaus-url ${URLHAUS_FEED_URL:-https://urlhaus.abuse.ch/downloads/csv_online/}
          --auth-key ${URLHAUS_AUTH_KEY:-}
          --max-records ${URLHAUS_EVENT_MAX_RECORDS:-400}
          --sleep-every ${URLHAUS_EVENT_SLEEP_EVERY:-400}
          --sleep-sec ${URLHAUS_EVENT_SLEEP_SEC:-65}
          --timeout-sec ${URLHAUS_TIMEOUT_SEC:-30} || true;
        sleep ${URLHAUS_POLL_SEC:-900};
      done"
    depends_on:
      postgres:
        condition: service_healthy
    volumes: *backend-volumes
    restart: unless-stopped

  # ── Live OSINT feeder: AlienVault OTX ─────────────────────────────────────
  otx-ingest-worker:
    build: *backend-build
    <<: *backend-env
    command: >
      /bin/sh -c "while true; do
        if [ -n \"${OTX_API_KEY:-}\" ]; then
          python -m app.integrations.real_data_pipeline
            --source-api-key ${OTX_SOURCE_API_KEY:-otx-live-secret-key}
            --classification PUBLIC
            --confidence 0.93
            otx
            --otx-api-key ${OTX_API_KEY}
            --otx-url ${OTX_SUBSCRIBED_URL:-https://otx.alienvault.com/api/v1/pulses/subscribed}
            --threat-source otx
            --limit ${OTX_LIMIT:-100}
            --max-records ${OTX_EVENT_MAX_RECORDS:-400}
            --sleep-every ${OTX_EVENT_SLEEP_EVERY:-400}
            --sleep-sec ${OTX_EVENT_SLEEP_SEC:-65}
            --timeout-sec ${OTX_TIMEOUT_SEC:-30} || true;
        else
          echo 'OTX_API_KEY not set; skipping OTX poll';
        fi;
        sleep ${OTX_POLL_SEC:-1800};
      done"
    depends_on:
      postgres:
        condition: service_healthy
    volumes: *backend-volumes
    restart: unless-stopped

  # ── AI inference consumer (Kafka → GNN scoring) ────────────────────────────
  inference-consumer:
    build: *backend-build
    <<: *backend-env
    environment:
      PYTHONPATH: /app
      INFERENCE_CONSUMER_TOPICS: ${KAFKA_EVENTS_TOPIC:-sentinel.events.v1}
      INFERENCE_MIN_INTERVAL_SEC: "60"
      INFERENCE_BATCH_THRESHOLD: "50"
      INFERENCE_WINDOW_KEY: ${GNN_WINDOW_KEY:-Wshort}
      INFERENCE_PREDICTION_TYPE: ${GNN_PREDICTION_TYPE:-risk_gnn}
    command: python -m app.streaming.inference_consumer
    depends_on:
      postgres:
        condition: service_healthy
      redpanda:
        condition: service_started
    volumes: *backend-volumes
    restart: unless-stopped

  # ── Corruption GNN training worker ─────────────────────────────────────────
  corruption-train-worker:
    build: *backend-build
    <<: *backend-env
    environment:
      PYTHONPATH: /app
    command: >
      /bin/sh -c "while true; do
        python -m app.analytics.corruption.train_worker
          --window-key Wcorruption
          --epochs 60;
        sleep 3600;
      done"
    depends_on:
      postgres:
        condition: service_healthy
    volumes: *backend-volumes
    restart: unless-stopped

  # ── Mule campaign analytics worker ─────────────────────────────────────────
  mule-campaign-worker:
    build: *backend-build
    <<: *backend-env
    command: >
      /bin/sh -c "while true; do
        python -m app.analytics.layer3.mule_campaign_worker
          --minutes 180
          --min-senders 2
          --min-tx 4;
        sleep 300;
      done"
    depends_on:
      postgres:
        condition: service_healthy
    volumes: *backend-volumes
    restart: unless-stopped

  # ─── Infrastructure ──────────────────────────────────────────────────────────

  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB:       ${POSTGRES_DB:-sentinel}
      POSTGRES_USER:     ${POSTGRES_USER:-sentinel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sentinel}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sentinel} -d ${POSTGRES_DB:-sentinel}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  neo4j:
    image: neo4j:5
    environment:
      NEO4J_AUTH: ${NEO4J_AUTH:-neo4j/change-me-neo4j-password}
      NEO4J_dbms_security_procedures_unrestricted: apoc.*
      NEO4J_dbms_connector_bolt_listen__address: 0.0.0.0:7687
      NEO4J_dbms_connector_http_listen__address: 0.0.0.0:7474
    ports:
      - "17474:7474"
      - "17687:7687"
    volumes:
      - neo4j_data:/data
    restart: unless-stopped

  opensearch:
    image: opensearchproject/opensearch:2.11.1
    environment:
      discovery.type: single-node
      plugins.security.disabled: "true"
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - opensearch_data:/usr/share/opensearch/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 30s

  redpanda:
    image: redpandadata/redpanda:v24.1.1
    command:
      - redpanda
      - start
      - --overprovisioned
      - --smp
      - "1"
      - --memory
      - "512M"
      - --reserve-memory
      - "0M"
      - --node-id
      - "0"
      - --check=false
      - --kafka-addr
      - PLAINTEXT://0.0.0.0:9092
      - --advertise-kafka-addr
      - PLAINTEXT://redpanda:9092
    ports:
      - "9092:9092"
      - "9644:9644"
    volumes:
      - redpanda_data:/var/lib/redpanda/data
    restart: unless-stopped

# ─── Volumes ──────────────────────────────────────────────────────────────────

volumes:
  postgres_data:
  neo4j_data:
  opensearch_data:
  redpanda_data:
  gnn_artifacts:      # trained GNN .pt files — persists across container restarts
