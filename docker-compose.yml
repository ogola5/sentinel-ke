# =============================================================================
# Sentinel-KE — Production Docker Compose
#
# QUICK START
#   cp .env.example .env   # fill in secrets
#   docker compose build
#   docker compose up -d
#
# AFTER CODE CHANGES
#   docker compose build <service> && docker compose up -d <service>
#
# SCALING
#   WEB_CONCURRENCY=8 docker compose up -d          # more workers, single host
#   docker stack deploy -c docker-compose.yml sentinel  # Docker Swarm
#   kubectl apply -f infra/k8s/backend.yaml             # Kubernetes
# =============================================================================

x-backend-build: &backend-build
  context: ./backend
  args:
    INSTALL_ALL_REQUIREMENTS: ${INSTALL_ALL_REQUIREMENTS:-1}

x-backend-env: &backend-env
  env_file: .env
  environment:
    PYTHONPATH: /app

x-backend-volumes: &backend-volumes
  - gnn_artifacts:/app/artifacts    # GNN model persistence across restarts

services:

  # ── API server ──────────────────────────────────────────────────────────────
  backend:
    build: *backend-build
    <<: *backend-env
    environment:
      PYTHONPATH: /app
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-1}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      opensearch:
        condition: service_healthy
      redpanda:
        condition: service_started
      neo4j:
        condition: service_started
    volumes: *backend-volumes
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    command: >
      uvicorn app.main:app
        --host 0.0.0.0
        --port 8000
        --workers ${WEB_CONCURRENCY:-2}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  # ── JupyterLab (ML training / notebooks) ───────────────────────────────────
  notebook:
    build: *backend-build
    <<: *backend-env
    environment:
      PYTHONPATH: /app
      JUPYTER_TOKEN: ${JUPYTER_TOKEN:-change-me-jupyter-token}
      GNN_CPU_THREADS: ${GNN_CPU_THREADS:-4}
      GNN_PRETRAIN_EPOCHS: ${GNN_PRETRAIN_EPOCHS:-3}
      GNN_RETRAIN_INTERVAL_SEC: ${GNN_RETRAIN_INTERVAL_SEC:-3600}
      CUBLAS_WORKSPACE_CONFIG: ${CUBLAS_WORKSPACE_CONFIG:-:4096:8}
    ports:
      - "8888:8888"
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_started
    volumes:
      - ./notebooks:/notebooks
      - gnn_artifacts:/app/artifacts
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    command: >
      jupyter lab
        --ip=0.0.0.0
        --port=8888
        --no-browser
        --allow-root
        --ServerApp.root_dir=/notebooks
        --IdentityProvider.token=${JUPYTER_TOKEN:-change-me-jupyter-token}
    restart: unless-stopped

  # ── Frontend (React + Vite) ─────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
    environment:
      VITE_API_PROXY_TARGET: http://backend:8000
      VITE_API_BASE_URL: http://localhost:8000
    ports:
      - "3000:5173"
    command: sh ./scripts/dev-start.sh
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  # ── Redpanda ingest consumer ────────────────────────────────────────────────
  redpanda-consumer:
    build: *backend-build
    <<: *backend-env
    command: python -m app.streaming.ingest_consumer --topics sentinel.ingest
    depends_on:
      - redpanda
      - postgres
    volumes: *backend-volumes
    restart: unless-stopped

  # ── Live OSINT feeder: Feodo Tracker ──────────────────────────────────────
  feodo-ingest-worker:
    build: *backend-build
    <<: *backend-env
    command: >
      /bin/sh -c "while true; do python -m app.integrations.real_data_pipeline --source-api-key ${FEODO_SOURCE_API_KEY:-feodo-live-secret-key} --classification PUBLIC --confidence 0.96 feodo --feodo-url ${FEODO_FEED_URL:-https://feodotracker.abuse.ch/downloads/ipblocklist_recommended.json} --timeout-sec ${FEODO_TIMEOUT_SEC:-30} || true; sleep ${FEODO_POLL_SEC:-300}; done"
    depends_on:
      postgres:
        condition: service_healthy
    volumes: *backend-volumes
    restart: unless-stopped

  # ── Live OSINT feeder: URLhaus ────────────────────────────────────────────
  urlhaus-ingest-worker:
    build: *backend-build
    <<: *backend-env
    command: >
      /bin/sh -c "while true; do AUTH_KEY=\"$${URLHAUS_AUTH_KEY:-$${ABUSECH_AUTH_KEY:-}}\"; if [ -n \"$${AUTH_KEY}\" ]; then python -m app.integrations.real_data_pipeline --source-api-key ${URLHAUS_SOURCE_API_KEY:-urlhaus-live-secret-key} --classification PUBLIC --confidence 0.94 urlhaus --urlhaus-url ${URLHAUS_FEED_URL:-https://urlhaus.abuse.ch/downloads/csv_online/} --auth-key \"$${AUTH_KEY}\" --max-records ${URLHAUS_EVENT_MAX_RECORDS:-400} --sleep-every ${URLHAUS_EVENT_SLEEP_EVERY:-400} --sleep-sec ${URLHAUS_EVENT_SLEEP_SEC:-65} --timeout-sec ${URLHAUS_TIMEOUT_SEC:-30} || true; else echo 'URLHAUS_AUTH_KEY / ABUSECH_AUTH_KEY not set; skipping URLhaus poll'; fi; sleep ${URLHAUS_POLL_SEC:-900}; done"
    depends_on:
      postgres:
        condition: service_healthy
    volumes: *backend-volumes
    restart: unless-stopped

  # ── Live OSINT feeder: AlienVault OTX ─────────────────────────────────────
  otx-ingest-worker:
    build: *backend-build
    <<: *backend-env
    command: >
      /bin/sh -c "while true; do if [ -n \"${OTX_API_KEY:-}\" ]; then python -m app.integrations.real_data_pipeline --source-api-key ${OTX_SOURCE_API_KEY:-otx-live-secret-key} --classification PUBLIC --confidence 0.93 otx --otx-api-key ${OTX_API_KEY} --otx-url ${OTX_SUBSCRIBED_URL:-https://otx.alienvault.com/api/v1/pulses/subscribed} --threat-source otx --limit ${OTX_LIMIT:-100} --max-records ${OTX_EVENT_MAX_RECORDS:-400} --sleep-every ${OTX_EVENT_SLEEP_EVERY:-400} --sleep-sec ${OTX_EVENT_SLEEP_SEC:-65} --timeout-sec ${OTX_TIMEOUT_SEC:-30} || true; else echo 'OTX_API_KEY not set; skipping OTX poll'; fi; sleep ${OTX_POLL_SEC:-1800}; done"
    depends_on:
      postgres:
        condition: service_healthy
    volumes: *backend-volumes
    restart: unless-stopped

  # ── Live OSINT feeder: ThreatFox ──────────────────────────────────────────
  threatfox-ingest-worker:
    build: *backend-build
    <<: *backend-env
    command: >
      /bin/sh -c "while true; do AUTH_KEY=\"$${THREATFOX_AUTH_KEY:-$${ABUSECH_AUTH_KEY:-$${URLHAUS_AUTH_KEY:-}}}\"; if [ -n \"$${AUTH_KEY}\" ]; then python -m app.integrations.real_data_pipeline --source-api-key ${OSINT_SOURCE_API_KEY:-osint-secret-key} --classification PUBLIC --confidence 0.94 threatfox --auth-key \"$${AUTH_KEY}\" --threatfox-url ${THREATFOX_FEED_URL:-https://threatfox.abuse.ch/export/json/recent/} --max-records ${THREATFOX_EVENT_MAX_RECORDS:-400} --sleep-every ${THREATFOX_EVENT_SLEEP_EVERY:-400} --sleep-sec ${THREATFOX_EVENT_SLEEP_SEC:-65} --timeout-sec ${THREATFOX_TIMEOUT_SEC:-30} || true; else echo 'THREATFOX_AUTH_KEY / ABUSECH_AUTH_KEY not set; skipping ThreatFox poll'; fi; sleep ${THREATFOX_POLL_SEC:-1800}; done"
    depends_on:
      postgres:
        condition: service_healthy
    volumes: *backend-volumes
    restart: unless-stopped

  # ── Live OSINT feeder: MalwareBazaar ──────────────────────────────────────
  malwarebazaar-ingest-worker:
    build: *backend-build
    <<: *backend-env
    command: >
      /bin/sh -c "while true; do AUTH_KEY=\"$${MALWAREBAZAAR_AUTH_KEY:-$${ABUSECH_AUTH_KEY:-$${URLHAUS_AUTH_KEY:-}}}\"; if [ -n \"$${AUTH_KEY}\" ]; then python -m app.integrations.real_data_pipeline --source-api-key ${OSINT_SOURCE_API_KEY:-osint-secret-key} --classification PUBLIC --confidence 0.95 malwarebazaar --auth-key \"$${AUTH_KEY}\" --malwarebazaar-url ${MALWAREBAZAAR_FEED_URL:-https://mb-api.abuse.ch/api/v1/} --max-records ${MALWAREBAZAAR_EVENT_MAX_RECORDS:-400} --sleep-every ${MALWAREBAZAAR_EVENT_SLEEP_EVERY:-400} --sleep-sec ${MALWAREBAZAAR_EVENT_SLEEP_SEC:-65} --timeout-sec ${MALWAREBAZAAR_TIMEOUT_SEC:-30} || true; else echo 'MALWAREBAZAAR_AUTH_KEY / ABUSECH_AUTH_KEY not set; skipping MalwareBazaar poll'; fi; sleep ${MALWAREBAZAAR_POLL_SEC:-1800}; done"
    depends_on:
      postgres:
        condition: service_healthy
    volumes: *backend-volumes
    restart: unless-stopped

  # ── AI inference consumer (Kafka → GNN scoring) ────────────────────────────
  inference-consumer:
    build: *backend-build
    <<: *backend-env
    environment:
      PYTHONPATH: /app
      INFERENCE_CONSUMER_TOPICS: ${KAFKA_EVENTS_TOPIC:-sentinel.events.v1}
      INFERENCE_MIN_INTERVAL_SEC: ${INFERENCE_MIN_INTERVAL_SEC:-30}
      INFERENCE_BATCH_THRESHOLD: ${INFERENCE_BATCH_THRESHOLD:-25}
      INFERENCE_WINDOW_KEY: ${GNN_WINDOW_KEY:-Wshort}
      INFERENCE_PREDICTION_TYPE: ${GNN_PREDICTION_TYPE:-risk_gnn}
      INFERENCE_MAX_ENTITIES: ${INFERENCE_MAX_ENTITIES:-2500}
      INFERENCE_CONSUMER_TIMEOUT_MS: ${INFERENCE_CONSUMER_TIMEOUT_MS:-1000}
    command: python -m app.streaming.inference_consumer
    depends_on:
      postgres:
        condition: service_healthy
      redpanda:
        condition: service_started
    volumes: *backend-volumes
    restart: unless-stopped

  # ── Graph feature snapshot worker (feeds both GNN pipelines) ───────────────
  graph-feature-worker:
    build: *backend-build
    <<: *backend-env
    environment:
      PYTHONPATH: /app
    command: /bin/sh -c "while true; do python -m app.analytics.layer3.graph_feature_worker --window-key Wmid; sleep 300; done"
    depends_on:
      postgres:
        condition: service_healthy
    volumes: *backend-volumes
    restart: unless-stopped

  # ── Neo4j projection worker (replays graph_delta_log into Neo4j) ──────────
  neo4j-worker:
    build: *backend-build
    <<: *backend-env
    environment:
      PYTHONPATH: /app
    command: /bin/sh -c "while true; do python -m app.graph.neo4j_worker --batch-size 5000; sleep 30; done"
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_started
    volumes: *backend-volumes
    restart: unless-stopped

  # ── Cyber GNN training worker ────────────────────────────────────────────────
  cyber-train-worker:
    build: *backend-build
    <<: *backend-env
    environment:
      PYTHONPATH: /app
      GNN_EDGE_BACKEND: postgres
      CUBLAS_WORKSPACE_CONFIG: ":4096:8"
      GNN_CPU_THREADS: ${GNN_CPU_THREADS:-4}
      GNN_PRETRAIN_EPOCHS: ${GNN_PRETRAIN_EPOCHS:-3}
      GNN_MAX_ENTITIES: ${GNN_MAX_ENTITIES:-2500}
      GNN_MAX_EDGES: ${GNN_MAX_EDGES:-20000}
      GNN_EPOCHS: ${GNN_EPOCHS:-30}
      GNN_HIDDEN_DIM: ${GNN_HIDDEN_DIM:-48}
      GNN_EMBED_DIM: ${GNN_EMBED_DIM:-24}
      GNN_SPLIT_POLICY: ${GNN_SPLIT_POLICY:-temporal_recency_holdout}
      GNN_MIN_NEGATIVE_COUNT: ${GNN_MIN_NEGATIVE_COUNT:-5}
      GNN_MIN_NEGATIVE_RATIO: ${GNN_MIN_NEGATIVE_RATIO:-0.1}
      GNN_BENCHMARK_WINDOW_CANDIDATES: ${GNN_BENCHMARK_WINDOW_CANDIDATES:-12}
      GNN_VAL_RATIO: ${GNN_VAL_RATIO:-0.2}
      GNN_MIN_REAL_RATIO: ${GNN_MIN_REAL_RATIO:-0.3}
      GNN_DETERMINISTIC_TRAINING: ${GNN_DETERMINISTIC_TRAINING:-true}
      GNN_USE_AMP: ${GNN_USE_AMP:-true}
      GNN_RETRAIN_INTERVAL_SEC: ${GNN_RETRAIN_INTERVAL_SEC:-14400}
    command: /bin/sh -c "while true; do python -m app.analytics.layer3.gnn_train_worker --window-key ${GNN_WINDOW_KEY:-Wmid} --edge-backend postgres --max-entities ${GNN_MAX_ENTITIES:-2500} --max-edges ${GNN_MAX_EDGES:-20000} --min-edge-weight ${GNN_MIN_EDGE_WEIGHT:-1} --negative-multiplier ${GNN_NEGATIVE_MULTIPLIER:-1.5} --minimum-negative-count ${GNN_MIN_NEGATIVE_COUNT:-5} --minimum-negative-ratio ${GNN_MIN_NEGATIVE_RATIO:-0.1} --benchmark-window-candidates ${GNN_BENCHMARK_WINDOW_CANDIDATES:-12} --threshold-min-samples ${GNN_THRESHOLD_MIN_SAMPLES:-10} --component-discovery-enabled 1 --component-min-size ${GNN_COMPONENT_MIN_SIZE:-3} --component-min-indicator-ratio ${GNN_COMPONENT_MIN_INDICATOR_RATIO:-0.5} --epochs ${GNN_EPOCHS:-30} --hidden-dim ${GNN_HIDDEN_DIM:-48} --embed-dim ${GNN_EMBED_DIM:-24} --dropout ${GNN_DROPOUT:-0.2} --learning-rate ${GNN_LEARNING_RATE:-0.001} --weight-decay ${GNN_WEIGHT_DECAY:-0.0001} --temporal-decay ${AI_TEMPORAL_EDGE_DECAY:-0.015} --split-policy ${GNN_SPLIT_POLICY:-temporal_recency_holdout} --val-ratio ${GNN_VAL_RATIO:-0.2} --pretrain-epochs ${GNN_PRETRAIN_EPOCHS:-3} --seed ${GNN_SEED:-7} --artifact-dir ${GNN_ARTIFACT_DIR:-/app/artifacts/gnn}; sleep ${GNN_RETRAIN_INTERVAL_SEC:-14400}; done"
    depends_on:
      postgres:
        condition: service_healthy
    volumes: *backend-volumes
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped

  # ── Corruption GNN training worker ─────────────────────────────────────────
  corruption-train-worker:
    build: *backend-build
    <<: *backend-env
    environment:
      PYTHONPATH: /app
      CUBLAS_WORKSPACE_CONFIG: ":4096:8"
      GNN_CPU_THREADS: ${GNN_CPU_THREADS:-4}
      GNN_MAX_ENTITIES: ${GNN_MAX_ENTITIES:-2500}
      GNN_MAX_EDGES: ${GNN_MAX_EDGES:-20000}
      GNN_EPOCHS: ${GNN_EPOCHS:-30}
      GNN_HIDDEN_DIM: ${GNN_HIDDEN_DIM:-48}
      GNN_EMBED_DIM: ${GNN_EMBED_DIM:-24}
      GNN_DROPOUT: ${GNN_DROPOUT:-0.2}
      GNN_LEARNING_RATE: ${GNN_LEARNING_RATE:-0.001}
      GNN_SEED: ${GNN_SEED:-7}
      GNN_RETRAIN_INTERVAL_SEC: ${GNN_RETRAIN_INTERVAL_SEC:-14400}
    command: /bin/sh -c "while true; do python -m app.analytics.corruption.train_worker --window-key ${CORRUPTION_WINDOW_KEY:-Wcorruption} --max-entities ${GNN_MAX_ENTITIES:-2500} --max-edges ${GNN_MAX_EDGES:-20000} --epochs ${GNN_EPOCHS:-30} --hidden-dim ${GNN_HIDDEN_DIM:-48} --embed-dim ${GNN_EMBED_DIM:-24} --dropout ${GNN_DROPOUT:-0.2} --learning-rate ${GNN_LEARNING_RATE:-0.001} --seed ${GNN_SEED:-7} --artifact-dir ${GNN_ARTIFACT_DIR:-/app/artifacts/gnn}; sleep ${GNN_RETRAIN_INTERVAL_SEC:-14400}; done"
    depends_on:
      postgres:
        condition: service_healthy
    volumes: *backend-volumes
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped

  # ── DDoS alert worker (structural spike + stage classification) ─────────────
  ddos-alert-worker:
    build: *backend-build
    <<: *backend-env
    environment:
      PYTHONPATH: /app
    command: >
      /bin/sh -c "while true; do
        python -m app.analytics.layer3.ddos_alert_worker
          --minutes 60
          --baseline-minutes 360;
        sleep 120;
      done"
    depends_on:
      postgres:
        condition: service_healthy
      opensearch:
        condition: service_healthy
    volumes: *backend-volumes
    restart: unless-stopped

  # ── Threat pattern worker (BEC, web-attack, vuln-overdue, backup-risk) ───────
  threat-pattern-worker:
    build: *backend-build
    <<: *backend-env
    environment:
      PYTHONPATH: /app
    command: >
      /bin/sh -c "while true; do
        python -m app.analytics.layer3.threat_pattern_worker
          --minutes 1440;
        sleep 300;
      done"
    depends_on:
      postgres:
        condition: service_healthy
    volumes: *backend-volumes
    restart: unless-stopped

  # ── Path risk worker (attack-path scoring via GNN neighborhoods) ─────────────
  path-risk-worker:
    build: *backend-build
    <<: *backend-env
    environment:
      PYTHONPATH: /app
    command:
      - /bin/sh
      - -c
      - |
        while true; do
          python -m app.analytics.layer3.path_risk_worker --window-key Wmid
          sleep 600
        done
    depends_on:
      postgres:
        condition: service_healthy
    volumes: *backend-volumes
    restart: unless-stopped

  # ── Decision fusion worker (GNN 60% + path 25% + anomaly 15%) ───────────────
  decision-fusion-worker:
    build: *backend-build
    <<: *backend-env
    environment:
      PYTHONPATH: /app
    command:
      - /bin/sh
      - -c
      - |
        while true; do
          python -m app.analytics.layer3.decision_fusion_worker --window-key Wmid
          sleep 600
        done
    depends_on:
      postgres:
        condition: service_healthy
    volumes: *backend-volumes
    restart: unless-stopped

  # ── Drift monitoring worker (distribution shift + fairness + auto-rollback) ──
  drift-monitor-worker:
    build: *backend-build
    <<: *backend-env
    environment:
      PYTHONPATH: /app
    command:
      - /bin/sh
      - -c
      - |
        while true; do
          python -m app.analytics.layer3.drift_worker --window-key Wmid
          sleep 1800
        done
    depends_on:
      postgres:
        condition: service_healthy
    volumes: *backend-volumes
    restart: unless-stopped

  # ── Anomaly worker (feeds decision fusion anomaly signal) ──────────────────
  anomaly-worker:
    build: *backend-build
    <<: *backend-env
    environment:
      PYTHONPATH: /app
    command: >
      /bin/sh -c "while true; do
        python -m app.analytics.layer3.anomaly_worker
          --minutes 60
          --baseline-minutes 360;
        sleep 300;
      done"
    depends_on:
      opensearch:
        condition: service_healthy
      postgres:
        condition: service_healthy
    volumes: *backend-volumes
    restart: unless-stopped

  # ── Auto containment worker (policy-gated last-mile actioning) ────────────
  auto-containment-worker:
    build: *backend-build
    <<: *backend-env
    environment:
      PYTHONPATH: /app
    command:
      - /bin/sh
      - -c
      - |
        while true; do
          python -m app.analytics.layer3.auto_containment_worker --prediction-type risk_gnn --window-key Wmid
          sleep 300
        done
    depends_on:
      postgres:
        condition: service_healthy
    volumes: *backend-volumes
    restart: unless-stopped

  # ── Legal evidence bundle worker (continuous legal packaging) ──────────────
  legal-bundle-worker:
    build: *backend-build
    <<: *backend-env
    environment:
      PYTHONPATH: /app
    command:
      - /bin/sh
      - -c
      - |
        while true; do
          python -m app.legal.bundle_seed_worker --exported-by legal-bundle-worker --include-stix --limit "${LEGAL_AUTO_BUNDLE_LIMIT:-50}"
          sleep 900
        done
    depends_on:
      postgres:
        condition: service_healthy
    volumes: *backend-volumes
    restart: unless-stopped

  # ── Mule campaign analytics worker ─────────────────────────────────────────
  mule-campaign-worker:
    build: *backend-build
    <<: *backend-env
    command: >
      /bin/sh -c "while true; do
        python -m app.analytics.layer3.mule_campaign_worker
          --minutes 180
          --min-senders 2
          --min-tx 4;
        sleep 300;
      done"
    depends_on:
      postgres:
        condition: service_healthy
    volumes: *backend-volumes
    restart: unless-stopped

  # ─── Edge sync agent ─────────────────────────────────────────────────────────
  # Runs on agency stations only.  Enable with:
  #   docker compose --profile edge up -d
  # Requires IS_EDGE_NODE=true and EDGE_* vars in .env.

  edge-sync-agent:
    profiles: ["edge"]
    build: *backend-build
    <<: *backend-env
    volumes: *backend-volumes
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      /bin/sh -c "while true;
        do python -m app.sync.edge_agent; sleep ${EDGE_SYNC_INTERVAL_SECONDS:-120}; done"
    restart: unless-stopped

  # ─── Infrastructure ──────────────────────────────────────────────────────────

  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB:       ${POSTGRES_DB:-sentinel}
      POSTGRES_USER:     ${POSTGRES_USER:-sentinel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sentinel}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sentinel} -d ${POSTGRES_DB:-sentinel}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  neo4j:
    image: neo4j:5
    environment:
      NEO4J_AUTH: ${NEO4J_AUTH:-neo4j/change-me-neo4j-password}
      NEO4J_dbms_security_procedures_unrestricted: apoc.*
      NEO4J_dbms_connector_bolt_listen__address: 0.0.0.0:7687
      NEO4J_dbms_connector_http_listen__address: 0.0.0.0:7474
    ports:
      - "17474:7474"
      - "17687:7687"
    volumes:
      - neo4j_data:/data
    restart: unless-stopped

  opensearch:
    image: opensearchproject/opensearch:2.11.1
    environment:
      discovery.type: single-node
      plugins.security.disabled: "true"
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - opensearch_data:/usr/share/opensearch/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 30s

  redpanda:
    image: redpandadata/redpanda:v24.1.1
    command:
      - redpanda
      - start
      - --overprovisioned
      - --smp
      - "1"
      - --memory
      - "512M"
      - --reserve-memory
      - "0M"
      - --node-id
      - "0"
      - --check=false
      - --kafka-addr
      - PLAINTEXT://0.0.0.0:9092
      - --advertise-kafka-addr
      - PLAINTEXT://redpanda:9092
    ports:
      - "9092:9092"
      - "9644:9644"
    volumes:
      - redpanda_data:/var/lib/redpanda/data
    restart: unless-stopped

# ─── Volumes ──────────────────────────────────────────────────────────────────

volumes:
  postgres_data:
  neo4j_data:
  opensearch_data:
  redpanda_data:
  gnn_artifacts:      # trained GNN .pt files — persists across container restarts
