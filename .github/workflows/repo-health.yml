name: Repository Health

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  health:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run Repository Health Checks
        run: ./scripts/repo_health_check.sh
