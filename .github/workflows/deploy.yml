name: Deploy to VPS

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    name: Deploy to VPS (204.168.200.91)
    runs-on: self-hosted

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy
        working-directory: /home/sentinel-ke
        run: |
          set -e

          echo "==> Pulling latest code"
          git pull origin main

          echo "==> Rebuilding backend image"
          docker compose build backend

          echo "==> Restarting backend"
          docker compose up -d backend

          echo "==> Waiting for backend to become healthy"
          for i in $(seq 1 12); do
            STATUS=$(docker inspect sentinel-ke-backend-1 --format='{{.State.Health.Status}}' 2>/dev/null || echo "unknown")
            echo "  attempt $i: $STATUS"
            if [ "$STATUS" = "healthy" ]; then
              echo "==> Backend is healthy"
              break
            fi
            if [ $i -eq 12 ]; then
              echo "==> Backend did not become healthy in time"
              docker compose logs backend --tail 30
              exit 1
            fi
            sleep 10
          done

          echo "==> Smoke test"
          curl -sf http://127.0.0.1:8000/ready > /dev/null && echo "==> /ready OK"

          echo "==> Deploy complete"
